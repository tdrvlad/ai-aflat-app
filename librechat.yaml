# ai-aflat product config: single custom endpoint wired to the orchestrator
# (Task 3, chatbot-phase1-colectorul). Keys verified against this v0.8.7 tree —
# see FORK-NOTES.md "Deviations" for the differences from the task brief's draft.
version: 1.3.13
cache: true

interface:
  customWelcome: 'Întreabă despre legislația din România. Răspunsurile vin cu sursa lângă ele.'
  privacyPolicy:
    externalUrl: 'https://ai-aflat.ro/confidentialitate'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://ai-aflat.ro/termeni'
    openNewTab: true
  # hide non-product surfaces (exact keys confirmed against packages/data-provider/src/config.ts
  # interfaceSchema; `endpointsMenu` from the brief's draft does not exist in this version —
  # it was removed upstream as a dead field, see FORK-NOTES.md).
  # modelSelect: false hides the *endpoint* list, not the search-mode picker — the picker is
  # now the `modelSpecs` list below, which carries the Romanian labels. Leaving modelSelect
  # true would render both, so the raw English model ids would show up next to the labels.
  # (ModelSelector still renders whenever modelSpecs is non-empty:
  # client/src/components/Chat/Menus/Endpoints/ModelSelector.tsx.)
  modelSelect: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  agents: false

fileConfig:
  endpoints:
    custom:
      disabled: true

endpoints:
  custom:
    - name: 'ai-aflat'
      apiKey: '${ORCHESTRATOR_API_KEY}'
      baseURL: '${ORCHESTRATOR_BASE_URL}'
      headers:
        x-aflat-user-id: '{{LIBRECHAT_USER_ID}}'
        x-aflat-conversation-id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      models:
        default: ['simple-search', 'deep-search']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'ai-aflat'

# The two search modes. Model *ids* are English (they are code identifiers, shared verbatim
# with the orchestrator); the Romanian the user reads lives only in `label`. Schema verified
# against packages/data-provider/src/models.ts (`specsConfigSchema` / `tModelSpecSchema`) in
# this v0.8.7 tree, not from docs.
# `enforce` is left at its schema default (false): enforcing would require every send to carry
# a spec, and nothing outside the picker does yet.
modelSpecs:
  prioritize: true
  list:
    - name: 'simple-search'
      label: 'Căutare simplă'
      default: true
      preset:
        endpoint: 'ai-aflat'
        model: 'simple-search'

    - name: 'deep-search'
      label: 'Căutare aprofundată'
      preset:
        endpoint: 'ai-aflat'
        model: 'deep-search'
