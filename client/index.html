    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      /* Pânza ground colours, kept in step with --gray-900 / --gray-50 in src/style.css.
         This paints the pre-hydration splash, so a mismatch shows as a flash. */
      const AFLAT_NIGHT = '#0a1524';
      const AFLAT_LINEN = '#fbf9f3';

      if (theme === 'dark') {
        backgroundColor = AFLAT_NIGHT;
      } else if (theme === 'light') {
        backgroundColor = AFLAT_LINEN;
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? AFLAT_NIGHT : AFLAT_LINEN;
      } else {
        backgroundColor = AFLAT_LINEN;
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script>
      (function () {
        var KEY = 'lc-asset-recovery-at';
        function shouldRecover() {
          try {
            var last = Number(sessionStorage.getItem(KEY)) || 0;
            if (Date.now() - last < 60000) {
              return false;
            }
            sessionStorage.setItem(KEY, String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        /** Recovers from stale builds (e.g. an outdated service worker serving old
         * hashed chunks after a deploy) by unregistering workers and reloading once.
         * Returns true when a recovery reload was initiated. */
        window.__lcRecoverStaleAssets = function () {
          if (!shouldRecover()) {
            return false;
          }
          var reload = function () {
            window.location.reload();
          };
          if (navigator.serviceWorker) {
            var scopeBase = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                return Promise.all(
                  registrations
                    .filter(function (registration) {
                      return registration.scope.indexOf(scopeBase) === 0;
                    })
                    .map(function (registration) {
                      return registration.unregister();
                    }),
                );
              })
              .then(reload, reload);
          } else {
            reload();
          }
          return true;
        };
        /**
         * Retire any service worker this browser still carries — silently, and
         * without a navigate.
         *
         * The worker is retired (see vite.config.ts), but a browser that
         * registered one on an earlier build keeps it until something removes
         * it. Leaving that to the self-destructing `sw.js` costs a full page
         * reload, because its activate handler navigates every window client —
         * and a reload lands on the sign-in exchange often enough to make
         * signing in take two or three attempts. Unregistering from here has
         * the same end state and reloads nothing: the retired worker never
         * activates, so it never navigates anybody.
         *
         * Scope-filtered, so a worker belonging to another app on the same
         * host is left alone. Deliberately not guarded by `shouldRecover()` —
         * this is idempotent and free once no registration remains.
         */
        if (navigator.serviceWorker) {
          try {
            var swScope = new URL('./', document.baseURI || window.location.href).href;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (registrations) {
                registrations.forEach(function (registration) {
                  if (registration.scope.indexOf(swScope) === 0) {
                    registration.unregister();
                  }
                });
              })
              .catch(function () {});
          } catch (e) {
            /* never let cleanup break the boot */
          }
        }
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (!event.data || event.data.type !== 'LC_SW_PING') {
              return;
            }
            var source = event.source || navigator.serviceWorker.controller;
            if (source) {
              source.postMessage({ type: 'LC_SW_PONG' });
            }
          });
        }
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) {
              return;
            }
            var failedScript = el.tagName === 'SCRIPT' && el.src;
            var failedPreload =
              el.tagName === 'LINK' && /preload/.test(el.rel || '') && /\.js$/.test(el.href || '');
            if (failedScript || failedPreload) {
              window.__lcRecoverStaleAssets();
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var message = event.reason && event.reason.message;
          if (
            typeof message === 'string' &&
            (message.indexOf('dynamically imported module') !== -1 ||
              message.indexOf('Importing a module script failed') !== -1)
          ) {
            window.__lcRecoverStaleAssets();
          }
        });
      })();
    </script>
    <!-- Cloudflare Web Analytics — cookieless: no cookies, no storage, no cross-site
         tracking, no profiles. Inlined here rather than plumbed through /api/config
         because startup config only reaches the authenticated chat route, which would
         miss login, register and shared conversations. The token is public by design
         (it ships in page source) and identifies the site, not the visitor.
         Gated on the production host so local and preview runs count nothing. -->
    <script>
      (function () {
        var HOSTS = ['app.ai-aflat.ro'];
        if (HOSTS.indexOf(location.hostname) === -1) {
          return;
        }
        var beacon = document.createElement('script');
        beacon.type = 'module';
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        beacon.setAttribute(
          'data-cf-beacon',
          JSON.stringify({ token: 'c89221bfaa9f45428061c170b690fd28' }),
        );
        document.head.appendChild(beacon);
      })();
