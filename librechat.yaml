# ai-aflat product config: single custom endpoint wired to the orchestrator
# (Task 3, chatbot-phase1-colectorul). Keys verified against this v0.8.7 tree —
# see FORK-NOTES.md "Deviations" for the differences from the task brief's draft.
version: 1.3.13
cache: true

# ┌─ COLLECTION GATE (Task 10 deploy) ────────────────────────────────────────┐
# │ Consent wording v2 is approved but not yet in the code, so production may  │
# │ not take a question from the public under the v1 wording that IS in the     │
# │ code (`CONSENT_WORDING_VERSION`/`ACK_VERSION` = 'v1-2026-07').              │
# │                                                                            │
# │ This is the gate for the AUTHENTICATED path. `isEmailDomainAllowed` runs in │
# │ `api/strategies/openidStrategy.js` BEFORE the user is even looked up, so an │
# │ allowlist here blocks every Clerk sign-in whose email domain is not listed  │
# │ — new accounts and existing ones alike. Nobody outside sapio.ro can reach   │
# │ the composer, the v1 ConsentModal, or write a message document. The sign-in │
# │ flow itself still runs all the way to Clerk and back, so the operator can   │
# │ walk it end to end.                                                        │
# │                                                                            │
# │ The ANONYMOUS path is gated separately by `AFLAT_ANON_QUESTION_MAX=0` in    │
# │ the server's .env — see .claude/tasks/task10-deploy-runbook.md.            │
# │                                                                            │
# │ TO OPEN THE PRODUCT TO THE PUBLIC: apply the v2 wording, bump both version  │
# │ constants, then delete this whole `registration:` block and set             │
# │ AFLAT_ANON_QUESTION_MAX=5. Both are one-line changes; neither needs a       │
# │ rebuild (this file is read at boot, that one at limiter construction).      │
# └────────────────────────────────────────────────────────────────────────────┘
registration:
  allowedDomains:
    - 'sapio.ro'

interface:
  customWelcome: 'Întreabă orice despre legislația din România. Răspunsurile vin cu sursa lângă ele.'
  privacyPolicy:
    externalUrl: 'https://ai-aflat.ro/confidentialitate'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://ai-aflat.ro/termeni'
    openNewTab: true
  # hide non-product surfaces (exact keys confirmed against packages/data-provider/src/config.ts
  # interfaceSchema; `endpointsMenu` from the brief's draft does not exist in this version —
  # it was removed upstream as a dead field, see FORK-NOTES.md).
  # modelSelect: false hides the *endpoint* list, not the search-mode picker — the picker is
  # now the `modelSpecs` list below, which carries the Romanian labels. Leaving modelSelect
  # true would render both, so the raw English model ids would show up next to the labels.
  # (ModelSelector still renders whenever modelSpecs is non-empty:
  # client/src/components/Chat/Menus/Endpoints/ModelSelector.tsx.)
  modelSelect: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  agents: false

fileConfig:
  endpoints:
    custom:
      disabled: true

endpoints:
  custom:
    - name: 'ai-aflat'
      apiKey: '${ORCHESTRATOR_API_KEY}'
      baseURL: '${ORCHESTRATOR_BASE_URL}'
      headers:
        x-aflat-user-id: '{{LIBRECHAT_USER_ID}}'
        x-aflat-conversation-id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        # The assistant message this completion will become. The orchestrator stores
        # it on the job so the fork can fetch that job's citations back out of band
        # once the stream ends (GET /v1/messages/{id}/sources). `LIBRECHAT_BODY_MESSAGEID`
        # resolves to `AgentClient.responseMessageId` — see packages/api/src/aflat/sources.ts.
        x-aflat-response-message-id: '{{LIBRECHAT_BODY_MESSAGEID}}'
      models:
        default: ['simple-search', 'standard-search', 'deep-search']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'ai-aflat'
      # The orchestrator narrates its retrieval stages on `reasoning_content`, which is
      # what makes the thinking panel render distinct stage headers instead of one blob.
      # `reasoningFormat: disabled` is about the *request*: the engine takes its effort
      # from the model id (see modelSpecs below), so the fork must not also send a
      # `reasoning_effort` / `reasoning` parameter of its own.
      # Keys verified against `customParams` in packages/data-provider/src/config.ts,
      # which is `.strict()` — nothing outside that object validates.
      customParams:
        reasoningKey: 'reasoning_content'
        reasoningFormat: 'disabled'

# The three search modes, one per effort level the engine actually takes (low | medium | high).
# Two ids used to be exposed, which left `medium` — the intended default and the middle rung of
# the price ladder — unreachable. Model *ids* are English (they are code identifiers, shared
# verbatim with the orchestrator, which maps id → effort on its side); the Romanian the user
# reads lives only in `label`. Schema verified against packages/data-provider/src/models.ts
# (`specsConfigSchema` / `tModelSpecSchema`) in this v0.8.7 tree, not from docs.
# `enforce` is left at its schema default (false): enforcing would require every send to carry
# a spec, and nothing outside the picker does yet.
# The Romanian labels are provisional — they still need a register pass before ship.
modelSpecs:
  prioritize: true
  list:
    - name: 'simple-search'
      label: 'Rapid'
      preset:
        endpoint: 'ai-aflat'
        model: 'simple-search'

    - name: 'standard-search'
      label: 'Normal'
      default: true
      preset:
        endpoint: 'ai-aflat'
        model: 'standard-search'

    - name: 'deep-search'
      label: 'Aprofundat'
      preset:
        endpoint: 'ai-aflat'
        model: 'deep-search'
